<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TruthLoop</title><script async src="https://www.googletagmanager.com/gtag/js?id=G-RBMQ2F6P9Q"></script><script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-RBMQ2F6P9Q');
</script><style>
body { background:#0f0f0f; color:#fff; font-family:Arial; margin:0; }
.container { max-width:500px; margin:auto; padding:18px; }
h2 { text-align:center; }
.tagline { text-align:center; font-size:13px; color:#aaa; }
.output {
  height:45vh; overflow-y:auto; background:#000;
  padding:15px; border-radius:12px; margin-bottom:10px;
}
input,button {
  width:100%; padding:12px; margin-top:10px;
  border-radius:8px; border:none;
}
button {
  background:linear-gradient(45deg, orange, #ff5e00);
  font-weight:bold;
}
#shareBox {
  display:none;
  background:#111;
  padding:15px;
  border-radius:12px;
  margin-top:10px;
  text-align:center;
  border:1px solid #222;
}
#paywallBox {
  display:none;
  background:#111;
  padding:18px;
  border-radius:12px;
  margin-top:12px;
  text-align:center;
  border:1px solid #222;
}
</style></head><body><div class="container"><h2>TruthLoop</h2>
<p class="tagline">You don’t need advice. You need clarity.</p><div id="loopIndicator">Loop 1 / 7</div><div id="outputBox" class="output"></div><input id="mainInput" placeholder="What are you avoiding right now?" />
<button id="getBtn">Start</button><input id="reflectionInput" placeholder="Answer honestly..." style="display:none;"/>
<button id="nextBtn" style="display:none;">Go deeper</button><!-- 🔥 SHARE BOX --><div id="shareBox">
  <div id="shareText"></div>
  <button onclick="copyShare()">Copy</button>
  <button onclick="whatsappShare()" style="margin-top:8px;">WhatsApp</button>
  <p style="font-size:11px; color:#777; margin-top:8px;">
    Send this to someone who needs it.
  </p>
</div><!-- 💰 PAYWALL --><div id="paywallBox">
  <div id="payTitle"></div>
  <div id="paySub"></div>
  <button id="payBtn"></button>
</div></div><script>

const outputBox = document.getElementById("outputBox");
const mainInput = document.getElementById("mainInput");
const reflectionInput = document.getElementById("reflectionInput");
const getBtn = document.getElementById("getBtn");
const nextBtn = document.getElementById("nextBtn");

const shareBox = document.getElementById("shareBox");
const shareText = document.getElementById("shareText");

const paywallBox = document.getElementById("paywallBox");
const payBtn = document.getElementById("payBtn");
const payTitle = document.getElementById("payTitle");
const paySub = document.getElementById("paySub");

let loopLevel = 1;
let messages = [];
let paid49 = false;
let paid199 = false;

function updateLoopUI(){
  document.getElementById("loopIndicator").innerText =
    `Loop ${loopLevel} / 7`;
}

function typeEffect(text){
  const div = document.createElement("div");
  outputBox.appendChild(div);
  let i = 0;
  function typing(){
    if(i < text.length){
      div.innerHTML += text.charAt(i);
      i++;
      setTimeout(typing, 8);
    }
  }
  typing();
}

async function callAPI(){
  const res = await fetch("/api/chat", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ messages, loopLevel })
  });
  const data = await res.json();
  return data.reply;
}

function showShareCard(text){
  const clean = text.replace(/<[^>]*>?/gm, '');
  const finalText =
`You’re avoiding:
${clean}

Most people never face this.

https://truthloop.in`;

  shareText.innerText = finalText;
  shareBox.style.display = "block";
}

function copyShare(){
  navigator.clipboard.writeText(shareText.innerText);
  alert("Copied");
}

function whatsappShare(){
  const text = encodeURIComponent(shareText.innerText);
  window.open(`https://wa.me/?text=${text}`);
}

getBtn.onclick = async ()=>{
  const text = mainInput.value.trim();
  if(!text) return;

  messages = [{ role:"user", content:text }];
  outputBox.innerHTML = `<b>You:</b> ${text}<br><br>`;

  const reply = await callAPI();
  typeEffect(reply);

  mainInput.value = "";
  reflectionInput.style.display = "block";
  nextBtn.style.display = "block";
  getBtn.style.display = "none";
};

nextBtn.onclick = async ()=>{
  const text = reflectionInput.value.trim();
  if(!text) return;

  if(loopLevel === 4 && !paid49){
    showPaywall49();
    return;
  }

  if(loopLevel === 6 && !paid199){
    showPaywall199();
    return;
  }

  loopLevel++;
  updateLoopUI();

  messages.push({ role:"user", content:text });
  outputBox.innerHTML += `<br><b>You:</b> ${text}<br><br>`;

  const reply = await callAPI();
  typeEffect(reply);

  // 🔥 VIRAL INJECTION
  if(loopLevel === 4){
    showShareCard(reply);
  }

  reflectionInput.value = "";
};

function showPaywall49(){
  paywallBox.style.display = "block";
  payTitle.innerText = "You see the truth.";
  paySub.innerText = "Now decide: stay stuck or move forward.";
  payBtn.innerText = "Unlock clarity (₹49)";
  payBtn.onclick = ()=>{
    paid49 = true;
    paywallBox.style.display = "none";
  };
}

function showPaywall199(){
  paywallBox.style.display = "block";
  payTitle.innerText = "Now take action.";
  paySub.innerText = "Clarity without action = nothing.";
  payBtn.innerText = "Unlock full clarity (₹199)";
  payBtn.onclick = ()=>{
    paid199 = true;
    paywallBox.style.display = "none";
  };
}

</script></body>
  </html>
