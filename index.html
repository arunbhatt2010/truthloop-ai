<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TruthLoop</title>

<style>
body { background:#0f0f0f; color:#fff; font-family:Arial; margin:0; }
.container { max-width:500px; margin:auto; padding:15px; }

.output {
  height:42vh; overflow-y:auto;
  background:#000; padding:15px;
  border-radius:12px; margin-bottom:10px;
  line-height:1.7;
}

input,button {
  width:100%; padding:12px;
  margin-top:10px; border-radius:8px; border:none;
}

button {
  background:linear-gradient(45deg, orange, #ff5e00);
  font-weight:bold; cursor:pointer;
}

.small { font-size:12px; color:#aaa; text-align:center; }
.links { text-align:center; margin-top:10px; }
.links a { color:#4da6ff; margin:0 5px; font-size:12px; }
</style>
</head>

<body>

<div class="container">

<h2 style="text-align:center;">TruthLoop</h2>
<p class="small">Clarity hurts. But confusion costs more.</p>

<div id="outputBox" class="output"></div>

<input id="mainInput" placeholder="Type what is real"/>
<button id="getBtn">Start</button>

<input id="reflectionInput" placeholder="Answer honestly..."/>
<button id="nextBtn">Go deeper</button>

<button id="pay49" style="display:none;">Unlock deeper (₹49)</button>
<button id="pay199" style="display:none;">Unlock full clarity (₹199)</button>

</div>

<script>

let messages=[];
let loopLevel=1;

const outputBox=document.getElementById("outputBox");
const mainInput=document.getElementById("mainInput");
const reflectionInput=document.getElementById("reflectionInput");

const pay49=document.getElementById("pay49");
const pay199=document.getElementById("pay199");

// 💰 PAYMENT STATE
if(localStorage.getItem("paid49")){
  pay49.style.display="none";
}
if(localStorage.getItem("paid199")){
  pay199.style.display="none";
}

// ₹49
pay49.onclick = ()=>{
  if(!localStorage.getItem("paid49")){
    window.open("https://rzp.io/rzp/Gl9QDcVA","_blank");
    alert("Complete payment and click again");
    localStorage.setItem("paid49","true");
    pay49.style.display="none";
  }
};

// ₹199
pay199.onclick = ()=>{
  if(!localStorage.getItem("paid199")){
    window.open("https://rzp.io/rzp/qcjrdEgd","_blank");
    alert("Complete payment and click again");
    localStorage.setItem("paid199","true");
    pay199.style.display="none";
  }
};

// FORMAT
function formatReply(text){
  return text.split("\n").map(line=>`<div>${line}</div>`).join("");
}

// API
async function callAPI(){
  const res=await fetch("/api/chat",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ messages, loopLevel })
  });

  const data=await res.json();
  let reply=data?.reply || "No reply";

  messages.push({role:"assistant",content:reply});
  return reply;
}

// START
getBtn.onclick=async ()=>{
  const text=mainInput.value.trim();
  if(!text) return;

  messages=[{role:"user",content:text}];
  outputBox.innerHTML=`<b>You:</b> ${text}<br><br>`;

  const reply=await callAPI();
  outputBox.innerHTML+=formatReply(reply);

  mainInput.value="";
};

// NEXT LOOP
nextBtn.onclick=async ()=>{
  const text=reflectionInput.value.trim();
  if(!text) return;

  // 🔒 PAYWALL LOGIC
  if(loopLevel === 3 && !localStorage.getItem("paid49")){
    pay49.style.display="block";
    alert("Unlock deeper thinking first");
    return;
  }

  if(loopLevel === 5 && !localStorage.getItem("paid199")){
    pay199.style.display="block";
    alert("Unlock full clarity to continue");
    return;
  }

  loopLevel++;

  messages.push({role:"user",content:text});
  outputBox.innerHTML+=`<br><b>You:</b> ${text}<br><br>`;

  const reply=await callAPI();
  outputBox.innerHTML+=formatReply(reply);

  reflectionInput.value="";
};

</script>

</body>
</html>
