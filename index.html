<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TruthLoop</title>

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-RBMQ2F6P9Q"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-RBMQ2F6P9Q');
</script>

<style>
body {
  background:#0f0f0f;
  color:#fff;
  font-family:Arial;
  margin:0;
}

.container {
  max-width:500px;
  margin:auto;
  padding:18px;
}

h2 {
  text-align:center;
  margin-bottom:5px;
}

.tagline {
  text-align:center;
  font-size:13px;
  color:#aaa;
  margin-bottom:15px;
}

.output {
  height:45vh;
  overflow-y:auto;
  background:#000;
  padding:15px;
  border-radius:12px;
  margin-bottom:10px;
  line-height:1.7;
  font-size:14px;
}

input,button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:none;
  font-size:14px;
}

input {
  background:#111;
  color:#fff;
}

button {
  background:linear-gradient(45deg, orange, #ff5e00);
  font-weight:bold;
  cursor:pointer;
}

#loopIndicator {
  text-align:center;
  font-size:12px;
  color:#ffae42;
  margin-bottom:8px;
}

#paywallBox {
  display:none;
  background:#111;
  padding:18px;
  border-radius:12px;
  margin-top:12px;
  text-align:center;
  border:1px solid #222;
}

.trust {
  font-size:11px;
  text-align:center;
  color:#666;
  margin-top:8px;
}
</style>
</head>

<body>

<div class="container">

<h2>TruthLoop</h2>

<p class="tagline">
Clarity doesn’t fail. Execution does.
</p>

<div id="loopIndicator">Loop 1 / 7</div>

<div id="outputBox" class="output"></div>

<input id="mainInput" placeholder="What are you avoiding right now?" />
<button id="getBtn">Start</button>

<input id="reflectionInput" placeholder="Answer honestly..." style="display:none;"/>
<button id="nextBtn" style="display:none;">Go deeper</button>

<div class="trust">
No login. No fluff. Just clarity.
</div>

<div id="paywallBox">
  <div id="payTitle" style="font-weight:bold; margin-bottom:8px;"></div>
  <div id="paySub" style="font-size:13px; color:#aaa; margin-bottom:12px;"></div>
  <button id="payBtn"></button>
  <button onclick="skipPaywall()" style="margin-top:8px; background:#222;">Not now</button>
</div>

</div>

<script>

const outputBox = document.getElementById("outputBox");
const mainInput = document.getElementById("mainInput");
const reflectionInput = document.getElementById("reflectionInput");
const getBtn = document.getElementById("getBtn");
const nextBtn = document.getElementById("nextBtn");

const paywallBox = document.getElementById("paywallBox");
const payBtn = document.getElementById("payBtn");
const payTitle = document.getElementById("payTitle");
const paySub = document.getElementById("paySub");

let paid49 = localStorage.getItem("paid49") === "true";
let paid199 = localStorage.getItem("paid199") === "true";

let messages = [];
let loopLevel = 1;

function updateLoopUI(){
  document.getElementById("loopIndicator").innerText =
    `Loop ${loopLevel} / 7`;
}

function typeEffect(text){
  const div = document.createElement("div");
  outputBox.appendChild(div);

  let i = 0;
  function typing(){
    if(i < text.length){
      div.innerHTML += text.charAt(i);
      i++;
      outputBox.scrollTop = outputBox.scrollHeight;
      setTimeout(typing, 8);
    }
  }
  typing();
}

async function callAPI(){
  try{
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages,
        loopLevel,
        paid49,
        paid199
      })
    });

    const data = await res.json();
    let reply = data?.reply || "No reply";

    messages.push({ role: "assistant", content: reply });
    return reply;

  } catch (e){
    return "⚠️ Server error";
  }
}

getBtn.onclick = async ()=>{
  const text = mainInput.value.trim();
  if(!text) return;

  gtag('event', 'start_clicked');

  messages = [{ role:"user", content:text }];
  outputBox.innerHTML = `<b>You:</b> ${text}<br><br>`;

  const reply = await callAPI();
  typeEffect(reply);

  mainInput.value = "";

  reflectionInput.style.display = "block";
  nextBtn.style.display = "block";
  getBtn.style.display = "none";
};

nextBtn.onclick = async ()=>{
  const text = reflectionInput.value.trim();
  if(!text) return;

  if(loopLevel === 4 && !paid49){
    showPaywall49();
    return;
  }

  if(loopLevel === 6 && !paid199){
    showPaywall199();
    return;
  }

  loopLevel++;
  updateLoopUI();

  gtag('event', 'loop_progress', { level: loopLevel });

  messages.push({ role:"user", content:text });
  outputBox.innerHTML += `<br><b>You:</b> ${text}<br><br>`;

  const reply = await callAPI();
  typeEffect(reply);

  reflectionInput.value = "";
};

function showPaywall49(){
  paywallBox.style.display = "block";

  payTitle.innerText = "You paused at the exact point most people do.";

  paySub.innerText =
  "You understand the problem.\n\n" +
  "But you still hesitate.\n\n" +
  "This is where people loop forever.\n\n" +
  "Break it or stay here.";

  payBtn.innerText = "Unlock clarity (₹49)";
  payBtn.onclick = ()=>{
    window.open("https://rzp.io/rzp/Gl9QDcVA","_blank");
    localStorage.setItem("paid49","true");
    paid49 = true;
    paywallBox.style.display = "none";
  };
}

function showPaywall199(){
  paywallBox.style.display = "block";

  payTitle.innerText = "Now it’s about action.";

  paySub.innerText =
  "You see it clearly now.\n\n" +
  "But clarity without action = nothing.\n\n" +
  "You either move… or stay stuck.";

  payBtn.innerText = "Unlock full clarity (₹199)";
  payBtn.onclick = ()=>{
    window.open("https://rzp.io/rzp/qcjrdEgd","_blank");

    localStorage.setItem("paid49","true");
    localStorage.setItem("paid199","true");

    paid49 = true;
    paid199 = true;

    paywallBox.style.display = "none";
  };
}

function skipPaywall(){
  paywallBox.style.display = "none";
}

</script>

</body>
                                                                             </html>
