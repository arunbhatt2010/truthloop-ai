<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TruthLoop</title>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-RBMQ2F6P9Q"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-RBMQ2F6P9Q');
</script>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
body{background:#0f0f0f;color:#fff;font-family:Arial;margin:0;}
.container{max-width:520px;margin:auto;padding:18px;padding-bottom:90px;}
h2{text-align:center;margin-bottom:5px;}
.tagline{text-align:center;font-size:13px;color:#aaa;margin-bottom:15px;}

.output{
  min-height:50vh;
  background:#000;
  padding:18px;
  border-radius:12px;
  margin-bottom:10px;
  line-height:1.6;
}

input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:none;
}

input{background:#111;color:#fff;}
button{background:linear-gradient(45deg,orange,#ff5e00);font-weight:bold;}

#shareBox,#paywallBox{
display:none;background:#111;padding:15px;border-radius:12px;
margin-top:10px;text-align:center;border:1px solid #222;
}
</style>
</head>

<body>

<div class="container">

<h2>TruthLoop</h2>
<p class="tagline">You don’t need advice. You need clarity.</p>

<div id="loopIndicator">Loop 1 / 7</div>

<div id="outputBox" class="output">
<div>
Hi, I am TruthLoop.<br><br>
I won't give advice.<br>
I’ll show you what you're avoiding.<br><br>
<b>Type ONE real problem:</b><br><br>
</div>
</div>

<input id="mainInput" placeholder="Example: I post daily but get no clients"/>
<button id="getBtn">Show me the truth →</button>

<input id="reflectionInput" style="display:none;" placeholder="Answer honestly..."/>
<button id="nextBtn" style="display:none;">Go deeper</button>

<div id="shareBox">
  <div id="shareText"></div>
  <button onclick="copyShare()">Copy</button>
  <button onclick="whatsappShare()">WhatsApp</button>
</div>

<div id="paywallBox">
  <div id="paySub"></div>
  <button id="payBtn"></button>
</div>

</div>

<script>

const API_URL="/api/chat";
const RAZORPAY_KEY_ID="rzp_live_SkoC6fqjfhi4WP";

const outputBox=document.getElementById("outputBox");
const mainInput=document.getElementById("mainInput");
const reflectionInput=document.getElementById("reflectionInput");
const getBtn=document.getElementById("getBtn");
const nextBtn=document.getElementById("nextBtn");

const shareBox=document.getElementById("shareBox");
const shareText=document.getElementById("shareText");

const paywallBox=document.getElementById("paywallBox");
const payBtn=document.getElementById("payBtn");
const paySub=document.getElementById("paySub");

let loopLevel=1;
let messages=[];
let payment49=false;
let payment199=false;
let shownLoop5=[];

function updateLoopUI(){
document.getElementById("loopIndicator").innerText=`Loop ${loopLevel} / 7`;
}

function typeEffect(text){
const div=document.createElement("div");
outputBox.appendChild(div);
let i=0;
function typing(){
if(i<text.length){
div.innerHTML+=text.charAt(i);
i++;
outputBox.scrollTop=outputBox.scrollHeight;
requestAnimationFrame(typing);
}
}
typing();
}

/* SAFE API */
async function callAPI(){
try{
const res=await fetch(API_URL,{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({messages,loopLevel,paid49:payment49,paid199:payment199,shownLoop5})
});
if(!res.ok) throw new Error("API fail");
const data=await res.json();
shownLoop5=data.shownLoop5||shownLoop5;
return data;
}catch(e){
console.error(e);
return {reply:"Something broke.\n\nTry again."};
}
}

/* SHARE */
function showShareCard(text){
const clean=text.replace(/<[^>]*>?/gm,'').trim();
shareText.innerText=`This hit me harder than expected.\n\n${clean}\n\nMost people avoid this.\n\nhttps://truthloop.in`;
shareBox.style.display="block";
}
function copyShare(){navigator.clipboard.writeText(shareText.innerText);}
function whatsappShare(){window.open(`https://wa.me/?text=${encodeURIComponent(shareText.innerText)}`);}

/* PAYWALL */
function showPaywall(message,amount){
paywallBox.style.display="block";
paySub.innerText=message;
payBtn.innerText=amount===49?"Break this loop (₹49)":"Unlock (₹199)";

payBtn.onclick=function(){
const rzp=new Razorpay({
key:RAZORPAY_KEY_ID,
amount:amount*100,
currency:"INR",
handler:function(){
if(amount===49) payment49=true;
if(amount===199) payment199=true;
paywallBox.style.display="none";
}
});
rzp.open();
};
}

/* START */
getBtn.onclick=async()=>{
const text=mainInput.value.trim();
if(!text)return;

messages=[{role:"user",content:text}];
outputBox.innerHTML=`<b>You:</b> ${text}<br><br>`;

const data=await callAPI();

typeEffect(data.reply);
messages.push({role:"assistant",content:data.reply});

mainInput.style.display="none";
reflectionInput.style.display="block";
nextBtn.style.display="block";
getBtn.style.display="none";
};

/* NEXT */
nextBtn.onclick = async () => {

const text = reflectionInput.value.trim();
if(!text) return;

/* ✅ पहले increment */
loopLevel++;

messages.push({role:"user",content:text});
outputBox.innerHTML+=`<br><b>You:</b> ${text}<br><br>`;

const data = await callAPI();

/* ✅ backend decides */
if(data.paywall){
showPaywall(data.reply, loopLevel===5 ? 49 : 199);
return;
}

messages.push({role:"assistant",content:data.reply});
updateLoopUI();
typeEffect(data.reply);

if(loopLevel===4){
setTimeout(()=>showShareCard(data.reply),300);
}

reflectionInput.value="";
};

</script>

</body>
  </html>
