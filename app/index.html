<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<meta name="keywords" content="TruthLoop, AI clarity tool, procrastination, validation addiction, overthinking, self awareness, emotional clarity">

<meta name="author" content="Arun Bhatt">

<!-- Razorpay --><script src="https://checkout.razorpay.com/v1/checkout.js"></script><!-- PayPal --><script src="https://www.paypal.com/sdk/js?client-id=AbX5PiAHABsKUXrSLi2nNoEcAfkKBSB5j610m_OClv4aCsO5wSER3dNZw9sXAhLOiA_gT6PbKJ9-jjf1&currency=USD"></script><style>
body{background:#0f0f0f;color:#fff;font-family:Arial;margin:0;}
.container{max-width:520px;margin:auto;padding:18px;padding-bottom:90px;}
.output{min-height:50vh;background:#000;padding:18px;border-radius:12px;margin-bottom:10px;line-height:1.6;}
input,button{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:none;}
input{background:#111;color:#fff;}
button{background:linear-gradient(45deg,orange,#ff5e00);font-weight:bold;}

#shareBox,#paywallBox{
display:none;background:#111;padding:15px;border-radius:12px;
margin-top:10px;text-align:center;border:1px solid #222;
}
</style></head><body><div class="container"><h2>TruthLoop</h2>
<p style="text-align:center;color:#aaa;">You don’t need advice. You need clarity.</p><div id="loopIndicator">Loop 1 / 7</div><div id="outputBox" class="output">
Hi, I am TruthLoop.<br><br>
Type ONE real problem:
</div><input id="mainInput" placeholder="Example: I post daily but get no clients"/>
<button id="getBtn">Show me the truth →</button><input id="reflectionInput" style="display:none;" placeholder="Answer honestly..."/>
<button id="nextBtn" style="display:none;">Go deeper</button><!-- 🔥 SHARE BOX --><div id="shareBox">
  <div id="shareText"></div>
  <button onclick="copyShare()">Copy</button>
  <button onclick="whatsappShare()">WhatsApp</button>
</div><!-- 🔥 PAYWALL --><div id="paywallBox">
  <div id="paySub"></div>  <!-- Razorpay --><button id="razorpayBtn"></button>

  <!-- PayPal -->  <div id="paypal-button"></div>
</div></div><script>

const API_URL="/api/chat";
const RAZORPAY_KEY_ID="rzp_live_SkoC6fqjfhi4WP";

const outputBox=document.getElementById("outputBox");
const mainInput=document.getElementById("mainInput");
const reflectionInput=document.getElementById("reflectionInput");
const getBtn=document.getElementById("getBtn");
const nextBtn=document.getElementById("nextBtn");

const shareBox=document.getElementById("shareBox");
const shareText=document.getElementById("shareText");

const paywallBox=document.getElementById("paywallBox");
const paySub=document.getElementById("paySub");
const razorpayBtn=document.getElementById("razorpayBtn");

let loopLevel=1;
let messages=[];
let payment49=false;
let payment199=false;

/* 🔥 Analytics */
function track(event,data={}){
if(typeof gtag!=="undefined"){
gtag('event',event,data);
}
}

/* API */
async function callAPI(){
  try {
    const res = await fetch(API_URL,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        messages,
        loopLevel,
        paid49:payment49,
        paid199:payment199
      })
    });

    if(!res.ok){
      const errorText = await res.text();
      console.error("API ERROR:", errorText);
      return { reply: "Server error 😃" };
    }

    return await res.json();

  } catch (err) {
    console.error("FETCH FAIL:", err);
    return { reply: "Network error 😃" };
  }
  }

/* TYPE EFFECT */
function typeEffect(text){
  const div=document.createElement("div");
  outputBox.appendChild(div);

  let i=0;

  function typing(){
    if(i<text.length){

      const char = text.charAt(i);

if(char === "<"){
  const end = text.indexOf(">", i);
  div.innerHTML += text.substring(i, end+1);
  i = end+1;
}
else if(char === "\n"){
  div.innerHTML += "<br>";
  i++;
}
else{
  div.innerHTML += char;
  i++;
  }

      outputBox.scrollTop = outputBox.scrollHeight;
      requestAnimationFrame(typing);
    }
  }

  typing();
  }

/* 🔥 SHARE */
function showShareCard(text){
const clean=text.replace(/<[^>]*>?/gm,'').trim();
shareText.innerText=
`This hit me harder than expected.

${clean}

Most people avoid this.

https://truthloop.in`;
shareBox.style.display="block";
}

function copyShare(){navigator.clipboard.writeText(shareText.innerText);}
function whatsappShare(){window.open(`https://wa.me/?text=${encodeURIComponent(shareText.innerText)}`);}

/* 🔥 PAYWALL */
function showPaywall(message, amount){

track("paywall_shown",{loop:loopLevel,amount});

paywallBox.style.display="block";
paySub.innerText=message;

/* Razorpay */
razorpayBtn.style.display="block";
razorpayBtn.innerText = amount===49 ? "Pay ₹49" : "Pay ₹199";

razorpayBtn.onclick=function(){
const rzp=new Razorpay({
key:RAZORPAY_KEY_ID,
amount:amount*100,
currency:"INR",
handler:function(){

if(amount===49) payment49=true;
if(amount===199) payment199=true;

track("payment_success",{method:"razorpay",value:amount});

alert("Payment successful 😄");
paywallBox.style.display="none";
}
});
rzp.open();
};

/* PayPal */
document.getElementById("paypal-button").innerHTML="";

paypal.Buttons({

createOrder:function(data,actions){
return actions.order.create({
purchase_units:[{
amount:{ value: amount===49 ? "3.00" : "9.00" }
}]
});
},

onApprove:function(data,actions){
return actions.order.capture().then(function(){

if(amount===49) payment49=true;
if(amount===199) payment199=true;

track("payment_success",{method:"paypal",value:amount});

alert("Payment successful 😄");
paywallBox.style.display="none";

});
}

}).render("#paypal-button");

}

/* START */
getBtn.onclick=async()=>{
const text=mainInput.value.trim();
if(!text)return;

track("start_clicked");

messages=[{role:"user",content:text}];
outputBox.innerHTML=`<b>You:</b> ${text}<br><br>`;

const data=await callAPI();

typeEffect(data.reply);
messages.push({role:"assistant",content:data.reply});

mainInput.style.display="none";
reflectionInput.style.display="block";
nextBtn.style.display="block";
getBtn.style.display="none";
};
function updateLoopUI() {
  document.getElementById("loopIndicator").innerText = `Loop ${loopLevel} / 7`;
}
/* NEXT */
nextBtn.onclick=async()=>{
console.log("Loop Level:", loopLevel);
const text=reflectionInput.value.trim();
if(!text)return;

loopLevel++;
updateLoopUI();
track("loop_progress",{loop:loopLevel});

messages.push({role:"user",content:text});
outputBox.innerHTML+=`<br><b>You:</b> ${text}<br><br>`;

const data=await callAPI();
console.log("Loop Level:", loopLevel);
if(data.paywall){
showPaywall(data.reply, loopLevel===5 ? 49 : 199);
return;
}

messages.push({role:"assistant",content:data.reply});
typeEffect(data.reply);

/* 🔥 SHARE TRIGGER */
if(loopLevel===4){
setTimeout(()=>showShareCard(data.reply),300);
}

reflectionInput.value="";
};

</script></body>
  </html>
